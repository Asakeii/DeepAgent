<!DOCTYPE html>
<html lang="zh-CN" class="h-full">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>deepAgent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @keyframes float-in{0%{opacity:0;transform:translateY(24px) scale(.96)}70%{opacity:1;transform:translateY(-3px) scale(1.01)}100%{opacity:1;transform:translateY(0) scale(1)}}
  @keyframes msg-user-in{0%{opacity:0;transform:translateX(16px) scale(.94)}60%{opacity:1;transform:translateX(-2px) scale(1.01)}100%{opacity:1;transform:translateX(0) scale(1)}}
  @keyframes msg-bot-in{0%{opacity:0;transform:translateX(-12px) scale(.96)}60%{opacity:1;transform:translateX(2px) scale(1.005)}100%{opacity:1;transform:translateX(0) scale(1)}}
  @keyframes think-wave{0%,100%{opacity:.15;transform:translateY(0)}25%{opacity:.9;transform:translateY(-6px)}50%{opacity:.3;transform:translateY(0)}}
  @keyframes ring-breathe{0%,100%{box-shadow:0 0 0 2px rgba(122,154,126,.25)}50%{box-shadow:0 0 0 10px rgba(122,154,126,0)}}
  @keyframes ring-explore{0%,100%{box-shadow:0 0 0 2px rgba(196,133,63,.25)}50%{box-shadow:0 0 0 10px rgba(196,133,63,0)}}
  @keyframes panel-slide{0%{transform:translateX(30px);opacity:0}100%{transform:translateX(0);opacity:1}}
  @keyframes chip-lift{0%{transform:translateY(0)}100%{transform:translateY(-2px)}}
  @keyframes dot-pulse{0%,100%{transform:scale(1);opacity:.4}50%{transform:scale(1.4);opacity:1}}
  @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
  @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
  @media(prefers-reduced-motion:reduce){*,::before,::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
  .font-display{font-family:'Playfair Display',serif}.font-body{font-family:'Inter',sans-serif}
  .ring-idle{box-shadow:0 0 0 1.5px rgba(44,41,38,.06)}
  .ring-coach{animation:ring-breathe 2.5s ease-in-out infinite}
  .ring-explore{animation:ring-explore 2.8s ease-in-out infinite}
  .msg-in-user{animation:msg-user-in .4s cubic-bezier(.34,1.56,.64,1) both}
  .msg-in-bot{animation:msg-bot-in .4s cubic-bezier(.34,1.56,.64,1) both}
  .panel-in{animation:panel-slide .3s cubic-bezier(.16,1,.3,1) both}
  .float-in{animation:float-in .6s cubic-bezier(.34,1.56,.64,1) both}
  .float-in-d1{animation-delay:.05s}.float-in-d2{animation-delay:.1s}.float-in-d3{animation-delay:.15s}.float-in-d4{animation-delay:.2s}
  .scrollbar::-webkit-scrollbar{width:3px}.scrollbar::-webkit-scrollbar-thumb{background:rgba(0,0,0,.06);border-radius:2px}
  .bg-page{background-color:#FBFAF8}.bg-surface{background:#F4F2EE}.bg-hover{background:#EFECE7}
  .text-body{color:#2C2926}.text-muted{color:rgba(44,41,38,.3)}.text-subtle{color:rgba(44,41,38,.5)}
  .border-hairline{border-color:rgba(44,41,38,.06)}
  .msg-user{background:#2C2926;color:#FBFAF8}
  .msg-assistant{background:#F4F2EE;color:#2C2926;border:1px solid rgba(44,41,38,.06)}
  .btn-send:active{transform:scale(.92);transition:transform .1s ease}
  .chip:hover{animation:chip-lift .2s ease both}
  @media(prefers-color-scheme:dark){
    .bg-page{background-color:#1C1A18}.bg-surface{background:#242220}.bg-hover{background:#2C2926}
    .text-body{color:#E8E3DE}.text-muted{color:rgba(232,227,222,.3)}.text-subtle{color:rgba(232,227,222,.45)}
    .border-hairline{border-color:rgba(232,227,222,.06)}
    .msg-user{background:#E8E3DE;color:#1C1A18}
    .msg-assistant{background:#242220;color:#E8E3DE;border-color:rgba(232,227,222,.06)}
    .ring-idle{box-shadow:0 0 0 1.5px rgba(232,227,222,.08)}
  }
</style>
</head>
<body class="font-body bg-page text-body h-full flex flex-col overflow-hidden">

<nav class="flex items-center justify-between px-5 py-3 border-b border-hairline shrink-0">
  <span class="font-display text-lg font-bold tracking-tight float-in">deepAgent</span>
  <div class="flex items-center gap-4">
    <span id="status-text" class="text-xs text-subtle hidden sm:inline transition-all duration-300 float-in float-in-d1"></span>
    <button onclick="newChat()" class="text-xs text-subtle hover:text-body transition-colors float-in float-in-d2">新对话</button>
    <button id="btn-history" onclick="toggleHistory()" class="text-xs text-subtle hover:text-body transition-colors relative float-in float-in-d3">
      历史<span id="history-count" class="hidden absolute -top-1.5 -right-3 w-3.5 h-3.5 rounded-full bg-body text-page text-[9px] flex items-center justify-center font-medium"></span>
    </button>
  </div>
</nav>

<div class="flex flex-1 overflow-hidden">

  <main class="flex-1 flex flex-col min-w-0">
    <div id="msg-container" class="flex-1 overflow-y-auto px-4 sm:px-8 py-6 space-y-4 scrollbar">
      <div class="flex flex-col items-center justify-center h-full">
        <div class="font-display text-5xl mb-4 italic float-in" style="font-weight:500">deepAgent</div>
        <p class="text-sm text-muted mb-6 float-in float-in-d1">你的私人教练，亦是知识伙伴</p>
        <div class="flex flex-wrap justify-center gap-2 max-w-sm">
          <button onclick="quickSend('今天慢跑了五公里')" class="chip px-3 py-1.5 bg-surface hover:bg-hover rounded-full text-xs text-subtle transition-all duration-200 float-in float-in-d1">晨跑归来</button>
          <button onclick="quickSend('记录一下午餐')" class="chip px-3 py-1.5 bg-surface hover:bg-hover rounded-full text-xs text-subtle transition-all duration-200 float-in float-in-d2">记录午餐</button>
          <button onclick="quickSend('看看这周运动情况')" class="chip px-3 py-1.5 bg-surface hover:bg-hover rounded-full text-xs text-subtle transition-all duration-200 float-in float-in-d3">本周回顾</button>
          <button onclick="quickSend('帮我分析一下最近有哪些新出的 AI 编程工具')" class="chip px-3 py-1.5 bg-surface hover:bg-hover rounded-full text-xs text-subtle transition-all duration-200 float-in float-in-d4">研究探索</button>
        </div>
      </div>
    </div>

    <div class="px-4 sm:px-8 pb-5 pt-2">
      <div id="ring" class="rounded-2xl ring-idle transition-all duration-700">
        <div id="img-preview" class="hidden px-2.5 pt-2.5"><div class="relative inline-block"><img id="img-preview-src" class="max-h-32 rounded-lg shadow-sm" src=""><button onclick="clearImage()" class="absolute -top-1.5 -right-1.5 w-5 h-5 rounded-full bg-body text-page flex items-center justify-center text-[10px] hover:scale-110 transition-transform">✕</button></div></div>
        <div class="flex items-end gap-2 bg-surface rounded-2xl p-2.5 transition-all duration-200">
          <textarea id="input" rows="1" placeholder="记录今天的点滴，或提出你想了解的问题…贴上图片可分析食物热量"
            class="flex-1 bg-transparent resize-none outline-none text-sm py-1.5 px-1.5 max-h-32 placeholder:text-muted"
            onkeydown="handleKey(event)" oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,128)+'px'"
            onpaste="handlePaste(event)"></textarea>
          <button id="btn-send" onclick="send()" class="btn-send shrink-0 w-9 h-9 rounded-xl bg-body text-page flex items-center justify-center hover:opacity-85 transition-all duration-300 disabled:opacity-60 disabled:scale-95">
            <svg id="btn-send-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 2L11 13"/><path d="M22 2L15 22L11 13L2 9L22 2Z"/></svg>
            <svg id="btn-send-loading" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="hidden" style="animation:spin .8s linear infinite"><circle cx="12" cy="12" r="9" stroke-dasharray="42" stroke-dashoffset="10"/></svg>
          </button>
        </div>
      </div>
      <div id="input-status" class="text-xs text-muted mt-2 px-2 transition-all duration-300 h-4">Enter 发送 · Shift+Enter 换行 · 粘贴图片分析食物</div>
    </div>
  </main>

  <aside id="history-panel" class="w-64 shrink-0 border-l border-hairline bg-surface flex flex-col hidden panel-in">
    <div class="flex items-center justify-between px-4 py-3 border-b border-hairline"><h3 class="text-xs font-medium tracking-wide text-subtle">历史对话</h3><button onclick="toggleHistory()" class="text-muted hover:text-subtle text-xs transition-colors">✕</button></div>
    <div id="history-list" class="flex-1 overflow-y-auto scrollbar p-2 space-y-0.5"><div class="px-3 py-6 text-center text-xs text-muted">加载中…</div></div>
  </aside>

  <aside id="research-panel" class="w-64 sm:w-72 shrink-0 border-l border-hairline p-4 overflow-y-auto scrollbar hidden panel-in bg-surface">
    <div class="flex items-center justify-between mb-3"><h3 class="font-display text-sm font-bold">探索进度</h3><button onclick="document.getElementById('research-panel').classList.add('hidden')" class="text-muted hover:text-subtle text-xs transition-colors">✕</button></div>
    <div id="research-steps" class="space-y-2 text-xs"></div>
  </aside>

</div>

<script>
let threadId='web-'+Date.now(),steps=[],sessions=[],histOpen=false,sending=false,imageB64='';

const AGENT_STATUS={coordinator:'思考意图…',planner:'规划步骤…',researcher:'搜索资料…',coder:'执行代码…',reporter:'撰写报告…',checkin:'记录打卡…',research_team:'调度任务…',human_feedback:'等待确认…'};

function handlePaste(e){
  const items=e.clipboardData?.items;if(!items)return;
  for(const item of items){
    if(!item.type.startsWith('image/'))continue;
    e.preventDefault();
    const f=item.getAsFile();if(!f)continue;
    const r=new FileReader();r.onload=()=>{imageB64=r.result;showPreview(r.result)};
    r.readAsDataURL(f);return;
  }
}
function showPreview(data){
  document.getElementById('img-preview-src').src=data;
  document.getElementById('img-preview').classList.remove('hidden');
}
function clearImage(){imageB64='';document.getElementById('img-preview').classList.add('hidden')}

function setSending(v){
  document.getElementById('btn-send-icon').classList.toggle('hidden',v);
  document.getElementById('btn-send-loading').classList.toggle('hidden',!v);
  document.getElementById('input-status').innerHTML=v?'<span class="text-subtle">处理中…</span>':'Enter 发送 · Shift+Enter 换行 · 粘贴图片分析食物';
}
function setStatus(a){
  const s=document.getElementById('status-text');
  s.textContent=AGENT_STATUS[a]||a||'';
  s.className='text-xs hidden sm:inline transition-all duration-300 '+(a==='checkin'?'text-[#7A9A7E]':a==='planner'||a==='researcher'?'text-[#C4853F]':'text-subtle');
  if(a)setSending(true);else setSending(false);
}
function setRing(m){
  document.getElementById('ring').className='rounded-2xl transition-all duration-700 '+(m==='coach'?'ring-coach':m==='explore'?'ring-explore':'ring-idle');
}

function handleKey(e){
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();if(!sending)send()}
}

function toggleHistory(){
  const p=document.getElementById('history-panel');
  histOpen=!histOpen;p.classList.toggle('hidden',!histOpen);
  if(histOpen)loadSessions()
}

async function loadSessions(){
  const list=document.getElementById('history-list');
  try{
    const r=await fetch('/api/sessions?limit=30');if(!r.ok)throw new Error(r.status);sessions=await r.json();
    const cnt=document.getElementById('history-count');
    if(sessions.length){cnt.textContent=sessions.length;cnt.classList.remove('hidden')}else{cnt.classList.add('hidden')}
    if(!sessions.length){list.innerHTML='<div class="px-3 py-6 text-center text-xs text-muted">暂无对话</div>';return}
    list.innerHTML=sessions.map(s=>{
      const isActive=s.ThreadID===threadId;
      const t=(s.FirstMsg||'新对话').slice(0,16)+(s.FirstMsg&&s.FirstMsg.length>16?'…':'');
      return '<div class="px-3 py-2 rounded-lg cursor-pointer transition-all duration-150 '+(isActive?'bg-hover':'hover:bg-hover')+'" onclick="switchSession(\''+s.ThreadID+'\')"><div class="text-xs truncate '+(isActive?'text-body font-medium':'text-subtle')+'">'+esc(t)+'</div><div class="text-[10px] text-muted mt-0.5">'+fmtTime(s.LastAt)+' · '+s.MsgCount+'条</div></div>';
    }).join('');
  }catch(e){list.innerHTML='<div class="px-3 py-6 text-center text-xs text-muted">加载失败</div>'}
}

function fmtTime(t){
  if(!t)return'';const d=new Date(t),n=new Date(),x=n-d;
  if(x<6e4)return'刚刚';if(x<36e5)return Math.floor(x/6e4)+'分钟前';if(x<864e5)return Math.floor(x/36e5)+'小时前';
  return(d.getMonth()+1)+'/'+d.getDate();
}

async function switchSession(tid){
  threadId=tid;steps=[];histOpen&&loadSessions();
  document.getElementById('research-panel').classList.add('hidden');
  const mc=document.getElementById('msg-container');mc.innerHTML='';
  try{
    const r=await fetch('/api/messages?thread_id='+tid);if(!r.ok)throw new Error(r.status);
    const msgs=await r.json();msgs.forEach((m,i)=>addMsg(m.Role==='user'?'user':'assistant',m.Content,'',i));
    mc.scrollTop=mc.scrollHeight;
  }catch(e){mc.innerHTML='<div class="flex items-center justify-center h-full text-muted text-sm">加载失败</div>'}
}

function newChat(){
  threadId='web-'+Date.now();steps=[];document.getElementById('research-panel').classList.add('hidden');
  document.getElementById('msg-container').innerHTML='<div class="flex flex-col items-center justify-center h-full"><div class="font-display text-5xl mb-4 italic float-in" style="font-weight:500">deepAgent</div><p class="text-sm text-muted mb-6 float-in float-in-d1">你的私人教练，亦是知识伙伴</p><div class="flex flex-wrap justify-center gap-2 max-w-sm"><button onclick="quickSend(\'今天慢跑了五公里\')" class="chip px-3 py-1.5 bg-surface hover:bg-hover rounded-full text-xs text-subtle transition-all duration-200 float-in float-in-d1">晨跑归来</button><button onclick="quickSend(\'记录一下午餐\')" class="chip px-3 py-1.5 bg-surface hover:bg-hover rounded-full text-xs text-subtle transition-all duration-200 float-in float-in-d2">记录午餐</button><button onclick="quickSend(\'看看这周运动情况\')" class="chip px-3 py-1.5 bg-surface hover:bg-hover rounded-full text-xs text-subtle transition-all duration-200 float-in float-in-d3">本周回顾</button><button onclick="quickSend(\'帮我分析一下最近有哪些新出的 AI 编程工具\')" class="chip px-3 py-1.5 bg-surface hover:bg-hover rounded-full text-xs text-subtle transition-all duration-200 float-in float-in-d4">研究探索</button></div></div>';
  loadSessions();setRing('idle');setStatus('');
}

function quickSend(t){document.getElementById('input').value=t;send()}

async function send(){
  if(sending)return;
  const input=document.getElementById('input'),btn=document.getElementById('btn-send');
  const text=input.value.trim();if(!text)return;
  input.value='';input.style.height='auto';sending=true;btn.disabled=true;
  const img=imageB64;imageB64='';clearImage();
  setRing('explore');setStatus('coordinator');

  const empty=document.getElementById('msg-container').querySelector('.flex.items-center.justify-center');
  if(empty)empty.innerHTML='';

  addMsg('user',text);
  const tmpId='t-'+Math.random().toString(36).slice(2);
  addMsg('assistant','<div class="flex gap-1.5 items-center h-3"><span class="w-1.5 h-1.5 rounded-full" style="background:rgba(44,41,38,.2);animation:dot-pulse 1s ease-in-out infinite"></span><span class="w-1.5 h-1.5 rounded-full" style="background:rgba(44,41,38,.2);animation:dot-pulse 1s ease-in-out .15s infinite"></span><span class="w-1.5 h-1.5 rounded-full" style="background:rgba(44,41,38,.2);animation:dot-pulse 1s ease-in-out .3s infinite"></span></div>',tmpId);

  try{
    const body={messages:[{role:'user',content:text||'分析这张图片'}],auto_accepted_plan:true,thread_id:threadId};if(img)body.image_base64=img;
    const resp=await fetch('/chat/stream',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const reader=resp.body.getReader();const d=new TextDecoder();let buf='',c='',st=false;
    while(true){const{done,value}=await reader.read();if(done)break;buf+=d.decode(value,{stream:true});
      const ls=buf.split('\n');buf=ls.pop()||'';
      for(const l of ls){
        if(l.startsWith('event:interrupt')){handleInterrupt();continue}
        if(!l.startsWith('data:'))continue;
        try{const j=JSON.parse(l.slice(5).trim());
          if(j.content==='end'||j.content==='processed')continue;if(j.role==='tool')continue;
          if(!st){st=true}c+=j.content||'';updateMsg(tmpId,esc(c));
          if(j.agent){setStatus(j.agent==='human_feedback'?'':j.agent);setRing(j.agent==='checkin'?'coach':j.agent?'explore':'idle')}
          if(j.agent==='planner'&&j.content)try{const p=JSON.parse(j.content);if(p.steps){steps=p.steps;renderSteps()}}catch(_){}
        }catch(_){}
      }
    }
    if(!st){removeMsg(tmpId);addMsg('assistant','已收到')}
    loadSessions();
  }catch(e){removeMsg(tmpId);addMsg('assistant','连接中断，请重试')}
  sending=false;btn.disabled=false;setRing('idle');setStatus('');
}

function addMsg(role,content,id,idx){
  const c=document.getElementById('msg-container');
  const d=document.createElement('div');
  d.className='flex '+(role==='user'?'justify-end msg-in-user':'justify-start msg-in-bot');
  const delay=idx!=null?idx*0.04:0;
  d.style.animationDelay=delay+'s';
  if(role==='user'){
    d.innerHTML='<div class="max-w-[80%] sm:max-w-[65%] msg-user rounded-2xl rounded-br-md px-4 py-2.5 text-sm leading-relaxed shadow-sm">'+esc(content)+'</div>';
  }else{
    d.innerHTML='<div class="flex items-start gap-2 max-w-[92%] sm:max-w-[75%]"><div class="w-6 h-6 rounded-full flex items-center justify-center shrink-0 mt-0.5 text-xs font-bold select-none" style="background:#2C2926;color:#FBFAF8">D</div><div class="msg-assistant rounded-2xl rounded-bl-md px-4 py-2.5 text-sm leading-relaxed shadow-sm">'+content+'</div></div>';
  }
  if(id)d.id=id;c.appendChild(d);c.scrollTop=c.scrollHeight;
}

function removeMsg(id){const e=document.getElementById(id);if(e)e.remove()}
function updateMsg(id,content){
  const e=document.getElementById(id);if(!e)return;
  const body=e.querySelector('.msg-assistant');if(!body)return;
  body.innerHTML=content;
  document.getElementById('msg-container').scrollTop=document.getElementById('msg-container').scrollHeight;
}

function handleInterrupt(){addMsg('assistant','<div class="space-y-2"><p class="text-xs text-subtle">已为你规划好研究路径，是否继续？</p><div class="flex gap-2"><button onclick="resume(\'accepted\')" class="px-3 py-1.5 rounded-lg text-xs font-medium transition-all duration-150 hover:scale-105" style="background:rgba(122,154,126,.1);color:#5C7A60">开始探索</button><button onclick="resume(\'edit_plan\')" class="px-3 py-1.5 rounded-lg text-xs font-medium transition-all duration-150 hover:scale-105" style="background:rgba(196,133,63,.1);color:#A06530">调整方向</button></div></div>')}

async function resume(fb){
  if(sending)return;sending=true;setStatus('human_feedback');setRing('explore');
  const tmpId2='r-'+Math.random().toString(36).slice(2);
  addMsg('assistant','<div class="flex gap-1.5 items-center h-3"><span class="w-1.5 h-1.5 rounded-full" style="background:rgba(44,41,38,.2);animation:dot-pulse 1s ease-in-out infinite"></span><span class="w-1.5 h-1.5 rounded-full" style="background:rgba(44,41,38,.2);animation:dot-pulse 1s ease-in-out .15s infinite"></span><span class="w-1.5 h-1.5 rounded-full" style="background:rgba(44,41,38,.2);animation:dot-pulse 1s ease-in-out .3s infinite"></span></div>',tmpId2);
  try{
    const resp=await fetch('/chat/stream',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[],interrupt_feedback:fb,thread_id:threadId})});
    const reader=resp.body.getReader();const d=new TextDecoder();let buf='',c='',st=false;
    while(true){const{done,value}=await reader.read();if(done)break;buf+=d.decode(value,{stream:true});const ls=buf.split('\n');buf=ls.pop()||'';for(const l of ls){if(!l.startsWith('data:'))continue;try{const j=JSON.parse(l.slice(5).trim());if(j.content==='end')continue;if(!st){st=true}c+=j.content||'';updateMsg(tmpId2,esc(c))}catch(_){}}}
  }catch(e){removeMsg(tmpId2);addMsg('assistant','连接中断')}
  sending=false;setRing('idle');setStatus('');
}

function renderSteps(){
  document.getElementById('research-panel').classList.remove('hidden');
  document.getElementById('research-steps').innerHTML=steps.map((s,i)=>`<div class="flex items-start gap-2 p-2 rounded-lg transition-all duration-300 ${s.execution_res?'bg-[rgba(122,154,126,.1)]':''}" style="animation:float-in .35s cubic-bezier(.34,1.56,.64,1) both;animation-delay:${i*.06}s"><span class="w-4 h-4 rounded-full flex items-center justify-center text-[10px] shrink-0 mt-0.5 transition-all duration-300 ${s.execution_res?'bg-[#7A9A7E] text-white':'bg-body/10 text-muted'}">${s.execution_res?'✓':i+1}</span><div><div class="font-medium">${esc(s.title||'')}</div><div class="text-muted mt-0.5">${esc((s.description||'').slice(0,60))}</div></div></div>`).join('');
}

function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
loadSessions();
</script>
</body>
</html>
