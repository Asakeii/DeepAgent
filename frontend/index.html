<!DOCTYPE html>
<html lang="zh-CN" class="h-full"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Lightning</title><link rel="icon" type="image/svg+xml" href="/favicon.svg"><link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"><script src="https://cdn.tailwindcss.com"></script>
<style>
@keyframes f-in{0%{opacity:0;transform:translateY(16px) scale(.97)}60%{opacity:1;transform:translateY(-2px) scale(1.01)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes msg-u{0%{opacity:0;transform:translateX(12px) scale(.95)}60%{opacity:1;transform:translateX(-1px) scale(1.005)}to{opacity:1;transform:translateX(0) scale(1)}}
@keyframes msg-b{0%{opacity:0;transform:translateX(-8px) scale(.97)}60%{opacity:1;transform:translateX(1px) scale(1.005)}to{opacity:1;transform:translateX(0) scale(1)}}
@keyframes card-in{0%{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes ring-g{0%,to{box-shadow:0 0 0 2px rgba(122,154,126,.2)}50%{box-shadow:0 0 0 8px rgba(122,154,126,0)}}
@keyframes ring-a{0%,to{box-shadow:0 0 0 2px rgba(196,133,63,.2)}50%{box-shadow:0 0 0 8px rgba(196,133,63,0)}}
@keyframes pulse{0%,to{transform:scale(1);opacity:.4}50%{transform:scale(1.4);opacity:1}}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes slide-p{from{transform:translateX(30px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes chip-lift{0%{transform:translateY(0)}to{transform:translateY(-2px)}}
.font-d{font-family:'Noto Serif SC',serif}.font-b{font-family:'Inter',sans-serif}
.ring-idle{box-shadow:0 0 0 1.5px rgba(44,41,38,.05)}
.ring-coach{animation:ring-g 2.5s ease-in-out infinite}.ring-research{animation:ring-a 2.8s ease-in-out infinite}
.f-in{animation:f-in .5s cubic-bezier(.34,1.56,.64,1) both}.f-d1{animation-delay:.05s}.f-d2{animation-delay:.1s}.f-d3{animation-delay:.15s}.f-d4{animation-delay:.2s}
.msg-u{animation:msg-u .35s cubic-bezier(.34,1.56,.64,1) both}.msg-b{animation:msg-b .35s cubic-bezier(.34,1.56,.64,1) both}
.card-stack{position:relative;min-height:40px;margin-bottom:8px}
.c-card{position:absolute;left:0;right:0;transition:all .5s cubic-bezier(.34,1.56,.64,1)}
.c-card:nth-child(1){z-index:1}.c-card:nth-child(2){z-index:2}.c-card:nth-child(3){z-index:3}.c-card:nth-child(4){z-index:4}.c-card:nth-child(5){z-index:5}
.c-card.active{z-index:20 !important;transform:translateY(0) scale(1)}
.c-card.done{opacity:.25;transform:translateY(-8px) scale(.88);filter:grayscale(.6)}
.c-card.done:hover{opacity:.6;transform:translateY(-4px) scale(.92)}
.c-card-in{animation:card-in .35s cubic-bezier(.34,1.56,.64,1) both}
.panel-in{animation:slide-p .3s cubic-bezier(.16,1,.3,1) both}
.rbox{animation:f-in .4s cubic-bezier(.34,1.56,.64,1) both;border:1.5px solid rgba(196,133,63,.2);background:linear-gradient(135deg,rgba(196,133,63,.04),rgba(196,133,63,.01))}
.surl{animation:f-in .3s ease both}
.rbox h1,.rbox h2,.rbox h3{font-family:'Noto Serif SC',serif;font-weight:700;margin:1em 0 .4em}
.rbox h1{font-size:1.2rem}.rbox h2{font-size:1rem;color:#C4853F}.rbox h3{font-size:.9rem}
.rbox ul,.rbox ol{padding-left:1.2em;margin:.4em 0}.rbox li{margin:.2em 0}
.rbox table{width:100%;border-collapse:collapse;margin:.6em 0;font-size:.8rem}
.rbox th,.rbox td{border:1px solid rgba(44,41,38,.1);padding:.3em .5em;text-align:left}
.rbox th{background:rgba(196,133,63,.08);font-weight:600}.rbox a{color:#C4853F;text-decoration:underline}.rbox strong{font-weight:600}
.scroll::-webkit-scrollbar{width:3px}.scroll::-webkit-scrollbar-thumb{background:rgba(0,0,0,.06);border-radius:2px}
.bg-p{background:#FBFAF8}.bg-s{background:#F4F2EE}.bg-h{background:#EFECE7}
.c-b{color:#2C2926}.c-m{color:rgba(44,41,38,.3)}.c-s{color:rgba(44,41,38,.5)}.b-hair{border-color:rgba(44,41,38,.06)}
.b-u{background:#2C2926;color:#FBFAF8}.b-bot{background:#F4F2EE;color:#2C2926;border:1px solid rgba(44,41,38,.06)}
.nbtn{transition:all .2s cubic-bezier(.34,1.56,.64,1)}.nbtn:hover{transform:scale(1.08);color:#2C2926}
.hitem{transition:all .15s ease}.hitem:hover{transform:translateX(3px)}.chip:hover{animation:chip-lift .2s ease both}
@media(prefers-color-scheme:dark){.bg-p{background:#1C1A18}.bg-s{background:#242220}.bg-h{background:#2C2926}.c-b{color:#E8E3DE}.c-m{color:rgba(232,227,222,.3)}.c-s{color:rgba(232,227,222,.45)}.b-hair{border-color:rgba(232,227,222,.06)}.b-u{background:#E8E3DE;color:#1C1A18}.b-bot{background:#242220;color:#E8E3DE;border-color:rgba(232,227,222,.06)}}
@media(prefers-reduced-motion:reduce){*,::before,::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head><body class="font-b bg-p c-b h-full flex flex-col overflow-hidden">
<nav class="flex items-center justify-between px-5 py-3 border-b b-hair shrink-0"><a href="/" class="font-d text-lg font-bold tracking-tight f-in cursor-pointer hover:opacity-80 transition-opacity no-underline c-b">Lightning</a><div class="flex items-center gap-4"><span id="stat" class="text-xs c-s hidden sm:inline transition-all duration-300 f-in f-d1"></span><button onclick="newChat()" class="nbtn text-xs c-s f-in f-d2">新对话</button><button id="bhist" onclick="toggleHist()" class="nbtn text-xs c-s relative f-in f-d3">历史<span id="hcnt" class="hidden absolute -top-1.5 -right-3 w-3.5 h-3.5 rounded-full bg-b c-b text-[9px] flex items-center justify-center font-medium" style="color:#FBFAF8"></span></button></div></nav>
<div id="pbar" class="h-0.5 bg-s shrink-0 hidden"><div id="pfill" class="h-full transition-all duration-700 ease-out" style="width:0;background:#C4853F"></div></div>
<div class="flex flex-1 overflow-hidden"><main class="flex-1 flex flex-col min-w-0"><div id="mc" class="flex-1 overflow-y-auto px-4 sm:px-8 py-6 space-y-4 scroll"><div class="flex flex-col items-center justify-center h-full"><div class="font-d text-5xl mb-4 italic f-in" style="font-weight:500">Lightning</div><p class="text-sm c-m mb-6 f-in f-d1">A spark of discipline, every day.</p><div class="flex flex-wrap justify-center gap-2 max-w-sm"><button onclick="qs('今天慢跑了五公里')" class="chip px-3 py-1.5 bg-s hover:bg-h rounded-full text-xs c-s transition-all duration-200 f-in f-d1">晨跑归来</button><button onclick="qs('记录一下午餐')" class="chip px-3 py-1.5 bg-s hover:bg-h rounded-full text-xs c-s transition-all duration-200 f-in f-d2">记录午餐</button><button onclick="qs('看看这周运动情况')" class="chip px-3 py-1.5 bg-s hover:bg-h rounded-full text-xs c-s transition-all duration-200 f-in f-d3">本周回顾</button><button onclick="qs('帮我分析一下最近有哪些新出的 AI 编程工具')" class="chip px-3 py-1.5 bg-s hover:bg-h rounded-full text-xs c-s transition-all duration-200 f-in f-d4">研究探索</button></div></div></div><div class="px-4 sm:px-8 pb-5 pt-2"><div id="ring" class="rounded-2xl ring-idle transition-all duration-700"><div id="img-pv" class="hidden px-2.5 pt-2.5"><div class="relative inline-block"><img id="img-pv-s" class="max-h-32 rounded-lg shadow-sm"><button onclick="clrImg()" class="absolute -top-1.5 -right-1.5 w-5 h-5 rounded-full bg-b c-b flex items-center justify-center text-[10px] hover:scale-110 transition-transform" style="color:#FBFAF8">✕</button></div></div><div class="flex items-end gap-2 bg-s rounded-2xl p-2.5"><textarea id="inp" rows="1" placeholder="记录今天的点滴，或提出你想了解的问题…贴上图片可分析食物热量" class="flex-1 bg-transparent resize-none outline-none text-sm py-2 px-1.5 max-h-32 placeholder:c-m" onkeydown="hk(event)" oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,128)+'px'"></textarea><button id="bsend" onclick="send()" class="shrink-0 w-9 h-9 rounded-xl bg-b c-b flex items-center justify-center hover:opacity-85 transition-all duration-200 disabled:opacity-40 disabled:scale-95" style="color:#FBFAF8"><svg id="sic" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 2L11 13"/><path d="M22 2L15 22L11 13L2 9L22 2Z"/></svg><svg id="sil" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" class="hidden" style="animation:spin .8s linear infinite"><circle cx="12" cy="12" r="9" stroke-dasharray="42" stroke-dashoffset="10"/></svg></button></div></div><div id="istat" class="text-xs c-m mt-2 px-2 transition-all duration-300 h-4">Enter 发送 · Shift+Enter 换行 · 粘贴图片分析食物</div></div></main><aside id="hpan" class="w-64 shrink-0 border-l b-hair bg-s flex flex-col hidden panel-in"><div class="flex items-center justify-between px-4 py-3 border-b b-hair"><h3 class="text-xs font-medium c-s">历史对话</h3><button onclick="toggleHist()" class="c-m hover:c-s text-xs">✕</button></div><div id="hlist" class="flex-1 overflow-y-auto scroll p-2 space-y-0.5"><div class="px-3 py-6 text-center text-xs c-m">加载中…</div></div></aside><aside id="rpan" class="w-64 sm:w-72 shrink-0 border-l b-hair p-4 overflow-y-auto scroll hidden panel-in bg-s"><div class="flex items-center justify-between mb-3"><h3 class="font-d text-sm font-bold">探索进度</h3><button onclick="document.getElementById('rpan').classList.add('hidden')" class="c-m hover:c-s text-xs">✕</button></div><div id="rsteps" class="space-y-2 text-xs"></div></aside></div>
<script>
let tid='w-'+Date.now(),steps=[],sess=[],hop=false,sendbusy=false,imgB64='',acards=[],lastAg='',searchN=0,phaseS=0;
const PHASES=['coordinator','planner','researcher','reporter'];
const AGST={coordinator:'思考意图…',planner:'规划步骤…',researcher:'搜索资料…',coder:'执行代码…',reporter:'撰写报告…',checkin:'记录打卡…',research_team:'调度任务…'};
const AGIC={coordinator:'🧭',planner:'📋',researcher:'🔍',coder:'💻',reporter:'📝',checkin:'🏃',research_team:'🔄',background_investigator:'🕵️'};
const AGLB={coordinator:'分析意图',planner:'制定计划',researcher:'搜索资料',coder:'执行代码',reporter:'整理报告',checkin:'记录打卡',research_team:'调度任务',background_investigator:'背景调查'};
function ring(m){document.getElementById('ring').className='rounded-2xl transition-all duration-700 '+(m==='coach'?'ring-coach':m==='research'?'ring-research':'ring-idle')}
function stat(a){var s=document.getElementById('stat');s.textContent=AGST[a]||a||'';s.className='text-xs hidden sm:inline transition-all duration-300 '+(a==='checkin'?'c-[#7A9A7E]':a==='planner'||a==='researcher'?'c-[#C4853F]':'c-s')}
function busy(v){document.getElementById('sic').classList.toggle('hidden',v);document.getElementById('sil').classList.toggle('hidden',!v);document.getElementById('istat').innerHTML=v?'<span class="c-s">处理中…</span>':'Enter 发送 · Shift+Enter 换行 · 粘贴图片分析食物'}
function hk(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();if(!sendbusy)send()}}
function qs(t){document.getElementById('inp').value=t;send()}
function acard(ag){
  var stack=document.getElementById('card-stack');
  if(!stack){stack=document.createElement('div');stack.className='card-stack';stack.id='card-stack';var mc=document.getElementById('mc');mc.appendChild(stack);mc.scrollTop=mc.scrollHeight}
  acards.forEach(function(a){var el=document.getElementById('c-'+a);if(el){el.classList.remove('active');el.classList.add('done');var d=el.querySelector('.dot');if(d){d.style.background='#7A9A7E';d.classList.remove('dot')}}});
  acards.push(ag);phaseS=Date.now();
  var pi=PHASES.indexOf(ag);
  if(pi>=0){var bar=document.getElementById('pbar'),fill=document.getElementById('pfill');bar.classList.remove('hidden');fill.style.width=Math.round(((pi+1)/PHASES.length)*100)+'%';if(ag==='reporter'){fill.style.background='#7A9A7E';setTimeout(function(){bar.classList.add('hidden')},2000)}}
  var ic=AGIC[ag]||'⚡',lb=AGLB[ag]||ag,ix=pi>=0?pi+1:'',n=acards.length;
  var d=document.createElement('div');d.className='c-card c-card-in active';d.id='c-'+ag;
  d.style.top=(n-1)*8+'px';
  d.innerHTML='<div class="rounded-xl px-3 py-2 text-xs" style="background:rgba(196,133,63,.08);border:1.5px solid rgba(196,133,63,.25);min-width:180px"><div class="flex items-center gap-2"><span class="dot w-2 h-2 rounded-full" style="background:#C4853F"></span><span style="color:#A06530">'+(ix?'Step '+ix+'/4: ':'')+ic+' '+lb+'</span></div>'+((ag==='planner'||ag==='researcher')?'<div class="c-m text-[10px] mt-1 ml-4" id="tm-'+ag+'">刚刚开始…</div>':'')+'</div>';
  stack.appendChild(d);document.getElementById('mc').scrollTop=document.getElementById('mc').scrollHeight;
  if(ag==='planner'||ag==='researcher'){var tm=function(){var el=document.getElementById('tm-'+ag);if(el){el.textContent='已等待 '+Math.round((Date.now()-phaseS)/1000)+' 秒…'}};tm();var iv=setInterval(tm,2000);acards._iv=acards._iv||{};if(acards._iv[ag])clearInterval(acards._iv[ag]);acards._iv[ag]=iv}
}
function srchCard(q){searchN++;var id='sc-'+searchN,c=document.getElementById('mc'),d=document.createElement('div');d.className='acard flex justify-start';d.id=id;d.innerHTML='<div class="rounded-xl px-3 py-2 text-xs" style="background:rgba(122,154,126,.06);border:1px solid rgba(122,154,126,.15)"><div class="flex items-center gap-2"><span class="dot w-2 h-2 rounded-full" style="background:#7A9A7E"></span><span class="c-s">🔍 '+E(q.slice(0,50))+'</span></div><div class="surls ml-4 mt-1 space-y-0.5"></div></div>';c.appendChild(d);c.scrollTop=c.scrollHeight}
function srchURL(id,url,idx){var el=document.getElementById(id);if(!el)return;var dm=url.replace(/^https?:\/\//,'').split('/')[0];var d=document.createElement('div');d.className='surl';d.style.animationDelay=idx*.15+'s';d.innerHTML='<div class="flex items-center gap-1.5 text-[10px] c-s"><span class="w-1 h-1 rounded-full" style="background:#7A9A7E"></span>'+dm+'</div>';el.querySelector('.surls').appendChild(d)}
function addM(role,content,id,idx){var c=document.getElementById('mc'),d=document.createElement('div');d.className='flex '+(role==='user'?'justify-end msg-u':'justify-start msg-b');if(idx!=null)d.style.animationDelay=idx*.04+'s';if(role==='user'){d.innerHTML='<div class="max-w-[80%] sm:max-w-[65%] b-u rounded-2xl rounded-br-md px-4 py-2.5 text-sm leading-relaxed shadow-sm">'+E(content)+'</div>'}else{d.innerHTML='<div class="flex items-start gap-2 max-w-[92%] sm:max-w-[75%]"><div class="w-6 h-6 rounded-full flex items-center justify-center shrink-0 mt-0.5 text-xs font-bold select-none" style="background:#2C2926;color:#FBFAF8">⚡</div><div class="b-bot rounded-2xl rounded-bl-md px-4 py-2.5 text-sm leading-relaxed shadow-sm">'+content+'</div></div>'}if(id)d.id=id;c.appendChild(d);c.scrollTop=c.scrollHeight}
function addMI(img,text){var c=document.getElementById('mc'),d=document.createElement('div');d.className='msg-u flex justify-end';d.innerHTML='<div class="max-w-[80%] sm:max-w-[65%] b-u rounded-2xl rounded-br-md px-3 py-2 text-sm leading-relaxed shadow-sm"><img src="'+img+'" class="max-h-48 rounded-lg mb-1.5"/>'+(text?'<div>'+E(text)+'</div>':'')+'</div>';c.appendChild(d);c.scrollTop=c.scrollHeight}
function rmM(id){var e=document.getElementById(id);if(e)e.remove()}
function upM(id,content){var e=document.getElementById(id);if(!e)return;var b=e.querySelector('.b-bot');if(b)b.innerHTML=content;document.getElementById('mc').scrollTop=document.getElementById('mc').scrollHeight}
function handlePaste(e){var items=e.clipboardData?e.clipboardData.items:null;if(!items)return;for(var i=0;i<items.length;i++){if(!items[i].type.startsWith('image/'))continue;e.preventDefault();var f=items[i].getAsFile();if(!f)continue;var r=new FileReader();r.onload=function(){imgB64=r.result;document.getElementById('img-pv-s').src=r.result;document.getElementById('img-pv').classList.remove('hidden')};r.readAsDataURL(f);return}}
function clrImg(){imgB64='';document.getElementById('img-pv').classList.add('hidden')}
function toggleHist(){hop=!hop;document.getElementById('hpan').classList.toggle('hidden',!hop);if(hop)loadSess()}
async function loadSess(){var list=document.getElementById('hlist');try{var r=await fetch('/api/sessions?limit=30');if(!r.ok)throw new Error(r.status);sess=await r.json();var cnt=document.getElementById('hcnt');if(sess.length){cnt.textContent=sess.length;cnt.classList.remove('hidden')}else{cnt.classList.add('hidden')}if(!sess.length){list.innerHTML='<div class="px-3 py-6 text-center text-xs c-m">暂无对话</div>';return}list.innerHTML=sess.map(function(s){var isA=s.ThreadID===tid,t=(s.FirstMsg||'新对话').slice(0,16);return'<div class="hitem px-3 py-2 rounded-lg cursor-pointer '+(isA?'bg-h':'hover:bg-h')+'" onclick="swSess(\''+s.ThreadID+'\')"><div class="text-xs truncate '+(isA?'c-b font-medium':'c-s')+'">'+E(t)+(s.FirstMsg&&s.FirstMsg.length>16?'…':'')+'</div><div class="text-[10px] c-m mt-0.5">'+ft(s.LastAt)+' · '+s.MsgCount+'条</div></div>'}).join('')}catch(e){list.innerHTML='<div class="px-3 py-6 text-center text-xs c-m">加载失败</div>'}}
function ft(t){if(!t)return'';var d=new Date(t),n=new Date(),x=n-d;if(x<6e4)return'刚刚';if(x<36e5)return Math.floor(x/6e4)+'分钟前';if(x<864e5)return Math.floor(x/36e5)+'小时前';return(d.getMonth()+1)+'/'+d.getDate()}
async function swSess(nt){tid=nt;steps=[];hop&&loadSess();document.getElementById('rpan').classList.add('hidden');var mc=document.getElementById('mc');mc.innerHTML='';try{var r=await fetch('/api/messages?thread_id='+nt);if(!r.ok)throw new Error(r.status);var ms=await r.json();ms.forEach(function(m,i){addM(m.Role==='user'?'user':'assistant',m.Content,'',i)});mc.scrollTop=mc.scrollHeight}catch(e){mc.innerHTML='<div class="flex items-center justify-center h-full c-m text-sm">加载失败</div>'}}
function newChat(){tid='w-'+Date.now();steps=[];acards=[];lastAg='';var cs=document.getElementById('card-stack');if(cs)cs.remove();document.getElementById('rpan').classList.add('hidden');document.getElementById('pbar').classList.add('hidden');document.getElementById('mc').innerHTML='<div class="flex flex-col items-center justify-center h-full"><div class="font-d text-5xl mb-4 italic f-in" style="font-weight:500">Lightning</div><p class="text-sm c-m mb-6 f-in f-d1">A spark of discipline, every day.</p><div class="flex flex-wrap justify-center gap-2 max-w-sm"><button onclick="qs(\'今天慢跑了五公里\')" class="chip px-3 py-1.5 bg-s hover:bg-h rounded-full text-xs c-s transition-all duration-200 f-in f-d1">晨跑归来</button><button onclick="qs(\'记录一下午餐\')" class="chip px-3 py-1.5 bg-s hover:bg-h rounded-full text-xs c-s transition-all duration-200 f-in f-d2">记录午餐</button><button onclick="qs(\'看看这周运动情况\')" class="chip px-3 py-1.5 bg-s hover:bg-h rounded-full text-xs c-s transition-all duration-200 f-in f-d3">本周回顾</button><button onclick="qs(\'帮我分析一下最近有哪些新出的 AI 编程工具\')" class="chip px-3 py-1.5 bg-s hover:bg-h rounded-full text-xs c-s transition-all duration-200 f-in f-d4">研究探索</button></div></div>';loadSess();ring('idle');stat('')}
async function send(){
  if(sendbusy)return;var inp=document.getElementById('inp'),btn=document.getElementById('bsend'),img=imgB64,text=inp.value.trim();
  imgB64='';clrImg();inp.value='';inp.style.height='auto';if(!text&&!img)return;
  sendbusy=true;btn.disabled=true;busy(true);ring('research');stat('coordinator');
  var empty=document.getElementById('mc').querySelector('.flex.items-center.justify-center');if(empty)empty.innerHTML='';
  if(img){addMI(img,text)}else{addM('user',text)}
  var tmpId='t-'+Math.random().toString(36).slice(2);
  addM('assistant','<div class="flex gap-1.5 items-center h-3"><span class="w-1.5 h-1.5 rounded-full" style="background:rgba(44,41,38,.2);animation:pulse 1s ease-in-out infinite"></span><span class="w-1.5 h-1.5 rounded-full" style="background:rgba(44,41,38,.2);animation:pulse 1s ease-in-out .15s infinite"></span><span class="w-1.5 h-1.5 rounded-full" style="background:rgba(44,41,38,.2);animation:pulse 1s ease-in-out .3s infinite"></span></div>',tmpId);
  if(img){try{var r=await fetch('/chat/stream',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[{role:'user',content:text||'分析这张图片'}],auto_accepted_plan:true,thread_id:tid,image_base64:img})});var rd=r.body.getReader(),dc=new TextDecoder(),buf='',c='',st=false;while(true){var dv=await rd.read();if(dv.done)break;buf+=dc.decode(dv.value,{stream:true});var ls=buf.split('\n');buf=ls.pop()||'';for(var i=0;i<ls.length;i++){var l=ls[i];if(!l.startsWith('data:'))continue;try{var j=JSON.parse(l.slice(5).trim());if(!j.content||j.content==='end')continue;if(!st){rmM(tmpId);st=true}c+=j.content;upM(tmpId,E(c))}catch(_){}}}if(!st){rmM(tmpId);addM('assistant','已收到')}loadSess()}catch(e){rmM(tmpId);addM('assistant','连接中断')}sendbusy=false;btn.disabled=false;busy(false);ring('idle');stat('');return}
  try{var r=await fetch('/chat/stream',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[{role:'user',content:text}],auto_accepted_plan:true,thread_id:tid})});var rd=r.body.getReader(),dc=new TextDecoder(),buf='',c='',st=false;
    while(true){var dv=await rd.read();if(dv.done)break;buf+=dc.decode(dv.value,{stream:true});var ls=buf.split('\n');buf=ls.pop()||'';for(var i=0;i<ls.length;i++){var l=ls[i];
      if(l.startsWith('event: interrupt')){ring('research');stat('human_feedback');acard('human_feedback');handleIntr();sendbusy=false;btn.disabled=false;busy(false);return}
      if(l.startsWith('event: agent'))continue;if(!l.startsWith('data:'))continue;
      try{var j=JSON.parse(l.slice(5).trim());if(!j.content||j.content==='end'||j.content==='processed')continue;
        if(j.role==='tool'){if(j.content)handleTRes(j.content);continue}
        if(j.agent&&j.agent!=='human_feedback'){stat(j.agent);ring(j.agent==='checkin'?'coach':j.agent?'research':'idle');if(j.agent!==lastAg){acard(j.agent);lastAg=j.agent}}
        if(j.tool_calls&&j.tool_calls[0])handleTC(j.tool_calls[0]);if(j.tool_call_chunks&&j.tool_call_chunks[0])handleTCC(j.tool_call_chunks[0]);
        if(!st){rmM(tmpId);st=true}c+=j.content||'';
        if(lastAg==='planner')upM(tmpId,'<div class="rounded-xl px-3 py-2 text-xs font-mono c-s leading-relaxed" style="background:rgba(196,133,63,.04);border:1px solid rgba(196,133,63,.1);max-height:120px;overflow-y:auto;white-space:pre-wrap;word-break:break-all">'+E(c.slice(-500))+'</div>');
        else if(lastAg==='reporter')upM(tmpId,'<div class="rbox rounded-2xl px-5 py-4 text-sm leading-relaxed">'+fmtMd(c)+'</div>');
        else upM(tmpId,E(c));
        if(j.agent==='planner'&&j.content)try{var p=JSON.parse(j.content);if(p.steps){steps=p.steps;renderSteps()}}catch(_){}
      }catch(_){}}}
    if(!st){rmM(tmpId);addM('assistant','已收到')}else if(lastAg==='reporter')upM(tmpId,'<div class="rbox rounded-2xl px-5 py-4 text-sm leading-relaxed"><div class="text-xs c-m mb-2">📝 报告完成</div>'+fmtMd(c)+'</div>');
    loadSess()}catch(e){rmM(tmpId);addM('assistant','连接中断')}
  sendbusy=false;btn.disabled=false;busy(false);ring('idle');stat('')}
function handleTC(tc){if(tc.name==='tavily-search'||tc.name==='web_search')srchCard('')}
function handleTCC(tc){if(tc.name==='tavily-search'||tc.name==='web_search'){try{var a=JSON.parse(tc.args||'{}');if(a.query){var el=document.getElementById('sc-'+searchN);if(el)el.querySelector('.c-s').textContent='🔍 '+E(a.query.slice(0,50))}}catch(_){}}}
function handleTRes(content){try{var j=JSON.parse(content);if(j.content){var urls=exU(JSON.stringify(j.content).slice(0,3000));if(urls.length&&searchN){var id='sc-'+searchN;urls.forEach(function(u,i){setTimeout(function(){srchURL(id,u,i)},i*200)})}}}catch(_){}}
function exU(s){var m=s.match(/https?:\/\/[^\s",}]+/g);return m?m.filter(function(v,i,a){return a.indexOf(v)===i}).slice(0,5):[]}
function handleIntr(){addM('assistant','<div class="space-y-2"><p class="text-xs c-s">已规划好研究路径，是否继续？</p><div class="flex gap-2"><button onclick="resume(\'accepted\')" class="px-3 py-1.5 rounded-lg text-xs font-medium transition-all duration-150 hover:scale-105" style="background:rgba(122,154,126,.1);color:#5C7A60">开始探索</button><button onclick="resume(\'edit_plan\')" class="px-3 py-1.5 rounded-lg text-xs font-medium transition-all duration-150 hover:scale-105" style="background:rgba(196,133,63,.1);color:#A06530">调整方向</button></div></div>')}
async function resume(fb){if(sendbusy)return;sendbusy=true;ring('research');stat('human_feedback');var tmpId='r-'+Math.random().toString(36).slice(2);addM('assistant','<div class="flex gap-1.5 items-center h-3"><span class="w-1.5 h-1.5 rounded-full" style="background:rgba(44,41,38,.2);animation:pulse 1s ease-in-out infinite"></span><span class="w-1.5 h-1.5 rounded-full" style="background:rgba(44,41,38,.2);animation:pulse 1s ease-in-out .15s infinite"></span><span class="w-1.5 h-1.5 rounded-full" style="background:rgba(44,41,38,.2);animation:pulse 1s ease-in-out .3s infinite"></span></div>',tmpId);try{var r=await fetch('/chat/stream',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[],interrupt_feedback:fb,thread_id:tid})});var rd=r.body.getReader(),dc=new TextDecoder(),buf='',c='',st=false;while(true){var dv=await rd.read();if(dv.done)break;buf+=dc.decode(dv.value,{stream:true});var ls=buf.split('\n');buf=ls.pop()||'';for(var i=0;i<ls.length;i++){var l=ls[i];if(!l.startsWith('data:'))continue;try{var j=JSON.parse(l.slice(5).trim());if(j.content==='end')continue;if(!st){rmM(tmpId);st=true}c+=j.content;upM(tmpId,E(c))}catch(_){}}}}catch(e){rmM(tmpId);addM('assistant','连接中断')}sendbusy=false;ring('idle');stat('')}
function renderSteps(){document.getElementById('rpan').classList.remove('hidden');document.getElementById('rsteps').innerHTML=steps.map(function(s,i){return'<div class="flex items-start gap-2 p-2 rounded-lg'+(s.execution_res?' bg-[rgba(122,154,126,.1)]':'')+'" style="animation:f-in .35s cubic-bezier(.34,1.56,.64,1) both;animation-delay:'+i*.06+'s"><span class="w-4 h-4 rounded-full flex items-center justify-center text-[10px] shrink-0 mt-0.5 '+(s.execution_res?'bg-[#7A9A7E] text-white':'bg-b/10 c-m')+'">'+(s.execution_res?'✓':i+1)+'</span><div><div class="font-medium">'+E(s.title||'')+'</div><div class="c-m mt-0.5">'+E((s.description||'').slice(0,60))+'</div></div></div>'}).join('')}
function fmtMd(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/^### (.+)$/gm,'<h3>$1</h3>').replace(/^## (.+)$/gm,'<h2>$1</h2>').replace(/^# (.+)$/gm,'<h1>$1</h1>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\[(.+?)\]\((.+?)\)/g,'<a href="$2" target="_blank">$1</a>').replace(/^---$/gm,'<hr>')}
function E(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML}
document.addEventListener('paste',handlePaste);loadSess()
</script></body></html>
