<!DOCTYPE html>
<html lang="zh-CN" class="h-full">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>deepAgent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  @keyframes pulse-green{0%,100%{box-shadow:0 0 0 0 rgba(122,154,126,.3)}50%{box-shadow:0 0 0 8px rgba(122,154,126,0)}}
  @keyframes pulse-amber{0%,100%{box-shadow:0 0 0 0 rgba(196,133,63,.3)}50%{box-shadow:0 0 0 8px rgba(196,133,63,0)}}
  @keyframes slide-in{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
  @keyframes fade-up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
  @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
  .font-display{font-family:'Playfair Display',serif}.font-body{font-family:'Inter',sans-serif}
  .ring-idle{box-shadow:0 0 0 1.5px rgba(45,42,38,.06)}
  .ring-coach{animation:pulse-green 2s ease-in-out infinite;box-shadow:0 0 0 2px #7A9A7E}
  .ring-explore{animation:pulse-amber 2.5s ease-in-out infinite;box-shadow:0 0 0 2px #C4853F}
  .msg-in{animation:fade-up .25s ease-out}
  .panel{animation:slide-in .3s ease-out}
  .scrollbar::-webkit-scrollbar{width:3px}.scrollbar::-webkit-scrollbar-thumb{background:rgba(0,0,0,.06);border-radius:2px}
  .bg-page{background-color:#FBFAF8}.bg-surface{background-color:#F4F2EE}.bg-hover{background-color:#EFECE7}
  .text-body{color:#2C2926}.text-muted{color:rgba(44,41,38,.35)}.text-subtle{color:rgba(44,41,38,.55)}
  .border-hairline{border-color:rgba(44,41,38,.06)}
  .badge-coach{background:rgba(122,154,126,.1);color:#5C7A60}
  .badge-explore{background:rgba(196,133,63,.1);color:#A06530}
  @media(prefers-color-scheme:dark){
    .bg-page{background-color:#1C1A18}.bg-surface{background-color:#242220}.bg-hover{background-color:#2C2926}
    .text-body{color:#E8E3DE}.text-muted{color:rgba(232,227,222,.3)}.text-subtle{color:rgba(232,227,222,.45)}
    .border-hairline{border-color:rgba(232,227,222,.06)}
    .ring-idle{box-shadow:0 0 0 1.5px rgba(232,227,222,.08)}
  }
</style>
</head>
<body class="font-body bg-page text-body h-full flex flex-col overflow-hidden">

<!-- Nav -->
<nav class="flex items-center justify-between px-5 py-3 border-b border-hairline shrink-0">
  <div class="flex items-center gap-2.5">
    <button onclick="toggleSidebar()" class="hidden md:block text-muted hover:text-subtle transition-colors">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
    </button>
    <span class="font-display text-lg font-bold tracking-tight">deepAgent</span>
    <span id="ring-dot" class="w-1.5 h-1.5 rounded-full bg-text-body/15 transition-colors duration-500"></span>
  </div>
  <button onclick="newChat()" class="text-xs text-subtle hover:text-body transition-colors">新对话</button>
</nav>

<div class="flex flex-1 overflow-hidden">

  <!-- Sidebar -->
  <aside id="sidebar" class="w-60 shrink-0 border-r border-hairline hidden md:flex flex-col bg-surface overflow-hidden">
    <div class="flex-1 overflow-y-auto scrollbar p-2 space-y-0.5">
      <div id="session-list" class="flex flex-col gap-0.5">
        <div class="px-3 py-2 text-xs text-muted font-medium tracking-wide">历史对话</div>
        <div id="sessions-empty" class="px-3 py-6 text-center text-xs text-muted">暂无对话记录</div>
      </div>
    </div>
  </aside>

  <!-- Chat -->
  <main class="flex-1 flex flex-col min-w-0">
    <div id="msg-container" class="flex-1 overflow-y-auto px-4 sm:px-8 py-6 space-y-4 scrollbar">
      <div class="flex flex-col items-center justify-center h-full text-muted">
        <div class="font-display text-5xl mb-4 italic" style="font-weight:500">deepAgent</div>
        <p class="text-sm mb-6">你的私人教练，亦是知识伙伴</p>
        <div class="flex flex-wrap justify-center gap-2 max-w-sm">
          <button onclick="quickSend('今天慢跑了五公里')" class="px-3 py-1.5 bg-surface hover:bg-hover rounded-full text-xs text-subtle transition-colors">晨跑归来</button>
          <button onclick="quickSend('记录一下午餐')" class="px-3 py-1.5 bg-surface hover:bg-hover rounded-full text-xs text-subtle transition-colors">记录午餐</button>
          <button onclick="quickSend('看看这周运动情况')" class="px-3 py-1.5 bg-surface hover:bg-hover rounded-full text-xs text-subtle transition-colors">本周回顾</button>
          <button onclick="quickSend('帮我分析一下最近有哪些新出的 AI 编程工具')" class="px-3 py-1.5 bg-surface hover:bg-hover rounded-full text-xs text-subtle transition-colors">研究探索</button>
        </div>
      </div>
    </div>

    <!-- Input -->
    <div class="px-4 sm:px-8 pb-5 pt-2">
      <div id="ring" class="rounded-2xl ring-idle transition-all duration-500">
        <div class="flex items-end gap-2 bg-surface rounded-2xl p-2.5">
          <textarea id="input" rows="1" placeholder="记录今天的点滴，或提出你想了解的问题…"
            class="flex-1 bg-transparent resize-none outline-none text-sm py-1.5 px-1.5 max-h-32 placeholder:text-muted"
            onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"
            oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,128)+'px'"></textarea>
          <button id="btn-send" onclick="send()" class="shrink-0 w-9 h-9 rounded-xl bg-body text-page flex items-center justify-center hover:opacity-85 transition-opacity disabled:opacity-25">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M22 2L11 13"/><path d="M22 2L15 22L11 13L2 9L22 2Z"/></svg>
          </button>
        </div>
      </div>
      <div class="text-xs text-muted mt-2 px-2">Enter 发送 · 后端自动识别意图并路由</div>
    </div>
  </main>

  <!-- Research Panel -->
  <aside id="research-panel" class="w-64 sm:w-72 shrink-0 border-l border-hairline p-4 overflow-y-auto scrollbar hidden panel bg-surface">
    <div class="flex items-center justify-between mb-3">
      <h3 class="font-display text-sm font-bold">探索进度</h3>
      <button onclick="document.getElementById('research-panel').classList.add('hidden')" class="text-muted hover:text-subtle text-xs">✕</button>
    </div>
    <div id="research-steps" class="space-y-2 text-xs"></div>
  </aside>

</div>

<script>
let threadId='web-'+Date.now(),steps=[],sessions=[];

function setRing(m){
  document.getElementById('ring').className='rounded-2xl transition-all duration-500 '+(m==='coach'?'ring-coach':m==='explore'?'ring-explore':'ring-idle');
  document.getElementById('ring-dot').className='w-1.5 h-1.5 rounded-full transition-colors duration-500 '+(m==='coach'?'badge-coach':m==='explore'?'badge-explore':'bg-body/15');
}

function toggleSidebar(){document.getElementById('sidebar').classList.toggle('hidden')}

async function loadSessions(){
  try{
    const r=await fetch('/api/sessions?limit=30');sessions=await r.json();
    const list=document.getElementById('session-list');
    list.innerHTML='<div class="px-3 py-2 text-xs text-muted font-medium tracking-wide">历史对话</div>';
    if(!sessions.length){list.innerHTML+='<div class="px-3 py-6 text-center text-xs text-muted">暂无对话记录</div>';return}
    sessions.forEach(s=>{
      const isActive=s.thread_id===threadId;
      const title=(s.first_msg||'新对话').slice(0,18)+(s.first_msg&&s.first_msg.length>18?'…':'');
      const d=document.createElement('div');
      d.className='px-3 py-1.5 rounded-lg text-xs cursor-pointer transition-colors '+(isActive?'bg-hover text-body font-medium':'text-subtle hover:bg-hover');
      d.innerHTML=`<div class="truncate">${escapeHtml(title)}</div>`;
      d.onclick=()=>switchSession(s.thread_id);
      list.appendChild(d);
    })
  }catch(_){}
}

async function switchSession(tid){
  threadId=tid;document.getElementById('msg-container').innerHTML='';
  steps=[];document.getElementById('research-panel').classList.add('hidden');
  try{
    const r=await fetch('/api/messages?thread_id='+tid);const msgs=await r.json();
    msgs.forEach(m=>addMsg(m.role==='user'?'user':'assistant',m.content));
  }catch(_){}
  loadSessions();setRing('idle');
}

function newChat(){
  threadId='web-'+Date.now();
  document.getElementById('msg-container').innerHTML='<div class="flex flex-col items-center justify-center h-full text-muted"><div class="font-display text-5xl mb-4 italic" style="font-weight:500">deepAgent</div><p class="text-sm mb-6">你的私人教练，亦是知识伙伴</p>'+
    '<div class="flex flex-wrap justify-center gap-2 max-w-sm"><button onclick="quickSend(\'今天慢跑了五公里\')" class="px-3 py-1.5 bg-surface hover:bg-hover rounded-full text-xs text-subtle transition-colors">晨跑归来</button><button onclick="quickSend(\'记录一下午餐\')" class="px-3 py-1.5 bg-surface hover:bg-hover rounded-full text-xs text-subtle transition-colors">记录午餐</button><button onclick="quickSend(\'看看这周运动情况\')" class="px-3 py-1.5 bg-surface hover:bg-hover rounded-full text-xs text-subtle transition-colors">本周回顾</button><button onclick="quickSend(\'帮我分析一下最近有哪些新出的 AI 编程工具\')" class="px-3 py-1.5 bg-surface hover:bg-hover rounded-full text-xs text-subtle transition-colors">研究探索</button></div></div>';
  steps=[];document.getElementById('research-panel').classList.add('hidden');
  loadSessions();setRing('idle');
}

function quickSend(t){document.getElementById('input').value=t;send()}

async function send(){
  const input=document.getElementById('input'),btn=document.getElementById('btn-send');
  const text=input.value.trim();if(!text)return;
  input.value='';input.style.height='auto';btn.disabled=true;setRing('explore');

  const empty=document.getElementById('msg-container').querySelector('.flex.items-center.justify-center');
  if(empty)empty.remove();

  addMsg('user',text);const tmpId='t-'+Math.random().toString(36).slice(2);
  addMsg('assistant','<div class="flex gap-1.5 items-center h-3"><span class="w-1.5 h-1.5 bg-body/15 rounded-full animate-bounce"></span><span class="w-1.5 h-1.5 bg-body/15 rounded-full animate-bounce" style="animation-delay:.1s"></span><span class="w-1.5 h-1.5 bg-body/15 rounded-full animate-bounce" style="animation-delay:.2s"></span></div>',tmpId);

  try{
    const resp=await fetch('/chat/stream',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[{role:'user',content:text}],auto_accepted_plan:true,thread_id:threadId})});
    const reader=resp.body.getReader();const d=new TextDecoder();let buf='',c='',st=false;
    while(true){const{done,value}=await reader.read();if(done)break;buf+=d.decode(value,{stream:true});
      const ls=buf.split('\n');buf=ls.pop()||'';
      for(const l of ls){
        if(l.startsWith('event:interrupt')){handleInterrupt();continue}
        if(!l.startsWith('data:'))continue;
        try{const j=JSON.parse(l.slice(5).trim());
          if(j.content==='end'||j.content==='processed')continue;if(j.role==='tool')continue;
          if(!st){removeMsg(tmpId);st=true}c+=j.content||'';updateMsg(tmpId,escapeHtml(c));
          if(j.agent==='checkin')setRing('coach');if(j.agent==='planner'||j.agent==='researcher')setRing('explore');
          if(j.agent==='planner'&&j.content)try{const p=JSON.parse(j.content);if(p.steps){steps=p.steps;renderSteps()}}catch(_){}
        }catch(_){}
      }
    }
    if(!st){removeMsg(tmpId);addMsg('assistant','已收到')}
    loadSessions();
  }catch(e){removeMsg(tmpId);addMsg('assistant','似乎断开了连接，请重试')}
  setRing('idle');btn.disabled=false;
}

function addMsg(role,content,id){
  const c=document.getElementById('msg-container');
  const d=document.createElement('div');
  d.className='msg-in flex '+(role==='user'?'justify-end':'justify-start');
  if(role==='user'){
    d.innerHTML='<div class="max-w-[80%] sm:max-w-[65%] bg-body text-page rounded-2xl rounded-br-md px-4 py-2.5 text-sm leading-relaxed">'+escapeHtml(content)+'</div>';
  }else{
    d.innerHTML='<div class="flex items-start gap-2 max-w-[92%] sm:max-w-[75%]"><div class="w-5 h-5 rounded-full bg-surface flex items-center justify-center shrink-0 mt-0.5 text-[10px] select-none">✦</div><div class="bg-surface rounded-2xl rounded-bl-md px-4 py-2.5 text-sm leading-relaxed">'+content+'</div></div>';
  }
  if(id)d.id=id;c.appendChild(d);c.scrollTop=c.scrollHeight;
}

function removeMsg(id){const e=document.getElementById(id);if(e)e.remove()}
function updateMsg(id,content){
  const e=document.getElementById(id);if(!e)return;
  const body=e.querySelector('.leading-relaxed');if(body)body.innerHTML=content;
  document.getElementById('msg-container').scrollTop=document.getElementById('msg-container').scrollHeight;
}

function handleInterrupt(){addMsg('assistant','<div class="space-y-2"><p class="text-xs text-subtle">已为你规划好研究路径，是否继续？</p><div class="flex gap-2"><button onclick="resume(\'accepted\')" class="px-3 py-1.5 badge-coach rounded-lg text-xs font-medium">开始探索</button><button onclick="resume(\'edit_plan\')" class="px-3 py-1.5 badge-explore rounded-lg text-xs font-medium">调整方向</button></div></div>')}

async function resume(fb){
  setRing('explore');const tmpId2='r-'+Math.random().toString(36).slice(2);
  addMsg('assistant','<div class="flex gap-1.5 items-center h-3"><span class="w-1.5 h-1.5 bg-body/15 rounded-full animate-bounce"></span><span class="w-1.5 h-1.5 bg-body/15 rounded-full animate-bounce" style="animation-delay:.1s"></span><span class="w-1.5 h-1.5 bg-body/15 rounded-full animate-bounce" style="animation-delay:.2s"></span></div>',tmpId2);
  try{
    const resp=await fetch('/chat/stream',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[],interrupt_feedback:fb,thread_id:threadId})});
    const reader=resp.body.getReader();const d=new TextDecoder();let buf='',c='',st=false;
    while(true){const{done,value}=await reader.read();if(done)break;buf+=d.decode(value,{stream:true});const ls=buf.split('\n');buf=ls.pop()||'';for(const l of ls){if(!l.startsWith('data:'))continue;try{const j=JSON.parse(l.slice(5).trim());if(j.content==='end')continue;if(!st){removeMsg(tmpId2);st=true}c+=j.content||'';updateMsg(tmpId2,escapeHtml(c))}catch(_){}}}
  }catch(e){removeMsg(tmpId2);addMsg('assistant','连接中断')}
  setRing('idle');
}

function renderSteps(){
  document.getElementById('research-panel').classList.remove('hidden');
  document.getElementById('research-steps').innerHTML=steps.map((s,i)=>`<div class="flex items-start gap-2 p-2 rounded-lg ${s.execution_res?'badge-coach':'bg-surface'}"><span class="w-4 h-4 rounded-full flex items-center justify-center text-[10px] shrink-0 mt-0.5 ${s.execution_res?'bg-[#7A9A7E] text-white':'bg-body/10 text-muted'}">${s.execution_res?'✓':i+1}</span><div><div class="font-medium">${escapeHtml(s.title||'')}</div><div class="text-muted mt-0.5">${escapeHtml((s.description||'').slice(0,60))}</div></div></div>`).join('');
}

function escapeHtml(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
loadSessions();
</script>
</body>
</html>
