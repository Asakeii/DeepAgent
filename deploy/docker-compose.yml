services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: deepagent
      MYSQL_DATABASE: deepagent
    ports:
      - "3306:3306"
    volumes:
      - ../internal/store/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pdeepagent"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 2s
      retries: 10

  searxng:
    image: searxng/searxng:latest
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/search?q=test&format=json"]
      interval: 10s
      timeout: 5s
      retries: 5

  deepagent:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      searxng:
        condition: service_healthy
    environment:
      DEEPAGENT_MODE: server
      DEEPAGENT_DEBUG_MCP: "true"
      WECHAT_TOKEN: "your_wechat_token_here"
      SEARXNG_URL: "http://searxng:8080"
      REDIS_URL: "redis:6379"
    ports:
      - "8741:8741"
    volumes:
      - ../conf/deep-agent.yaml:/app/conf/deep-agent.yaml:ro

volumes:
  mysql-data:
  redis-data:
